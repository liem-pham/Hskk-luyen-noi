<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>HSKK Luyện Nghe</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#fff;color:#111;line-height:1.5}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #eee;padding:13px 16px;z-index:10}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
main{max-width:720px;margin:0 auto;padding:16px}
footer{max-width:720px;margin:0 auto;padding:24px 16px 20px;text-align:center;font-size:12px;color:#bbb}
footer a{color:#bbb;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:none;padding:0;color:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lesson-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:22px 16px;text-align:left;cursor:pointer}
.lesson-card b{font-size:17px;font-weight:600}
.lesson-card:active{background:#f7f7f7}
.back{color:#888;font-size:15px;margin-bottom:10px}
.lesson-title{font-size:20px;font-weight:600;margin:2px 0 14px;letter-spacing:-.01em}
.seg{display:flex;background:#f2f2f2;border-radius:999px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:7px 0;border-radius:999px;font-size:14px;color:#666}
.seg button.active{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.item{border:1px solid #e8e8e8;border-radius:14px;padding:14px 16px;margin:0 0 10px}
.item-title{font-weight:600;font-size:15px;margin-bottom:10px}
.item-title small{color:#888;font-weight:400}
.player{display:flex;align-items:center;gap:10px}
.play{flex:none;width:34px;height:34px;border:1px solid #ddd;border-radius:50%;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;color:#111}
.play:active{background:#f2f2f2}
.track{flex:1;height:4px;background:#eee;border-radius:2px;cursor:pointer;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#111;border-radius:2px}
.time{flex:none;font-size:12px;color:#888;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{flex:none;font-size:12px;color:#666;border:1px solid #eee;border-radius:999px;padding:3px 9px}
.ans-row{display:flex;justify-content:space-between;align-items:center;width:100%;border-top:1px solid #f2f2f2;margin-top:12px;padding:10px 0 0;font-size:15px;text-align:left}
.ans-row .chev{color:#aaa;transition:transform .15s}
.ans-row.open .chev{transform:rotate(90deg)}
.answer{display:none;margin-top:12px}
.answer.open{display:block}
.pills{display:flex;gap:8px;margin-bottom:12px}
.pill{border:1px solid #ddd;border-radius:999px;padding:4px 12px;font-size:13px;color:#555}
.pill.on{background:#111;color:#fff;border-color:#111}
.sent{margin-bottom:12px}
.sent-zh{font-size:19px;line-height:2}
.sent-zh rt{font-size:11px;color:#666}
.answer:not(.show-pinyin) .sent-zh rt{display:none}
.answer:not(.show-pinyin) .sent-zh{line-height:1.5}
.sent-vi{color:#333;font-size:15px;margin-top:2px}
.answer:not(.show-vi) .sent-vi{display:none}
.keypoints{background:#f7f7f7;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:4px}
.keypoints b{display:block;margin-bottom:4px}
.keypoints li{margin-bottom:2px}
.check{display:flex;gap:8px;margin-top:10px}
.check-input{flex:1;min-width:0;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:15px;font-family:inherit;color:#111;outline:none}
.check-input:focus{border-color:#111}
.check-btn{flex:none;border:1px solid #ddd;border-radius:999px;padding:6px 14px;font-size:14px}
.check-btn:active{background:#f2f2f2}
.check-result{margin-top:10px;font-size:15px;line-height:1.9}
.check-result .ok{color:#1a7f37}
.check-result .bad{color:#d1242f}
.check-result .score{font-size:13px;color:#888;margin-top:2px}
audio{display:none}
</style>
</head>

i có nhiều thời gian học tập/nghỉ ngơi hơn", "Vấn đề: việc gì cũng để máy làm, mình không vận động thì sức khỏe kém đi", "Kết luận: tương lai tốt hay không không chỉ xem công nghệ, còn xem chúng ta sống thế nào; học tốt, sống tốt thì tương lai ngày càng tốt"]}]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById('data').textContent);
var AUDIO_BASE = "https://ewqcpwfwwamfzozosrmx.supabase.co/storage/v1/object/public/hskk-audio/";
var app = document.getElementById('app');
var currentAudio = null, currentPlayBtn = null;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){ if(!isFinite(t)) return '0:00'; var m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }

function rubyHTML(sentence){
  var out = '';
  sentence.chars.forEach(function(c){
    if(c.py){ out += '<ruby>' + esc(c.ch) + '<rt>' + esc(c.py) + '</rt></ruby>'; }
    else { out += esc(c.ch); }
  });
  return out;
}
function sentenceHTML(s){
  return '<div class="sent"><div class="sent-zh">' + rubyHTML(s) + '</div>' +
         '<div class="sent-vi">' + esc(s.vi) + '</div></div>';
}
function itemHTML(lesson, part, idx, title, sub, audioFile, sentences, keyPoints){
  var id = lesson.id + '-' + part + '-' + idx;
  var body = sentences.map(sentenceHTML).join('');
  if(keyPoints){
    body += '<div class="keypoints"><b>Ý chính</b><ul>' +
      keyPoints.map(function(k){return '<li>' + esc(k) + '</li>';}).join('') + '</ul></div>';
  }
  var check = '';
  if(part === 'p1'){
    var target = sentences[0].chars.filter(function(c){ return c.py; }).map(function(c){ return c.ch; }).join('');
    check = '<div class="check" data-target="' + esc(target) + '">' +
      '<input class="check-input" type="text" placeholder="Gõ lại câu này" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<button class="check-btn">Kiểm tra</button></div>' +
      '<div class="check-result"></div>';
  }
  return '<div class="item" id="' + id + '">' +
    '<div class="item-title">' + esc(title) + (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</div>' +
    '<audio preload="metadata" src="' + AUDIO_BASE + audioFile + '"></audio>' +
    '<div class="player">' +
      '<button class="play" aria-label="Phát">▶</button>' +
      '<div class="track"><div class="fill"></div></div>' +
      '<span class="time">0:00 / 0:00</span>' +
      '<button class="speed" data-speed="1">1×</button>' +
    '</div>' + check +
    '<button class="ans-row"><span>Đáp án</span><span class="chev">›</span></button>' +
    '<div class="answer"><div class="pills">' +
      '<button class="pill tg-py">Pinyin</button>' +
      '<button class="pill tg-vi">Nghĩa</button>' +
    '</div>' + body + '</div></div>';
}

function renderHome(){
  var h = '<div class="grid">';
  DATA.lessons.forEach(function(l){
    h += '<button class="lesson-card" data-lesson="' + l.id + '"><b>' + esc(l.title) + '</b></button>';
  });
  app.innerHTML = h + '</div>';
  app.querySelectorAll('.lesson-card').forEach(function(b){
    b.addEventListener('click', function(){ renderLesson(b.getAttribute('data-lesson')); });
  });
  window.scrollTo(0,0);
}

function partHTML(l, part){
  var h = '';
  if(part === 'p1'){
    l.part1.forEach(function(s, i){
      h += itemHTML(l, 'p1', i, 'Câu ' + (i+1), '', l.id + '-p1-' + String(i+1).padStart(2,'0') + '.mp3', [s], null);
    });
  } else {
    l.part2.forEach(function(p, i){
      h += itemHTML(l, 'p2', i, 'Đoạn ' + (i+1), p.topic, p.audio, p.sentences, p.key_points);
    });
  }
  return h;
}

function renderLesson(lid){
  var l = DATA.lessons.find(function(x){return x.id===lid;});
  app.innerHTML = '<button class="back" id="backBtn">‹ Tất cả</button>' +
    '<div class="lesson-title">' + esc(l.title) + '</div>' +
    '<div class="seg"><button data-part="p1" class="active">Phần 1</button><button data-part="p2">Phần 2</button></div>' +
    '<div id="partBody">' + partHTML(l, 'p1') + '</div>';
  document.getElementById('backBtn').addEventListener('click', renderHome);
  app.querySelectorAll('.seg button').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.classList.contains('active')) return;
      if(currentAudio) { currentAudio.pause(); }
      app.querySelectorAll('.seg button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('partBody').innerHTML = partHTML(l, btn.getAttribute('data-part'));
      wireItems();
      window.scrollTo(0,0);
    });
  });
  wireItems();
  window.scrollTo(0,0);
}

function wireItems(){
  app.querySelectorAll('.item').forEach(function(item){
    var audio = item.querySelector('audio');
    var playBtn = item.querySelector('.play');
    var track = item.querySelector('.track');
    var fill = item.querySelector('.fill');
    var timeEl = item.querySelector('.time');
    var speedBtn = item.querySelector('.speed');
    function updateTime(){
      timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
      fill.style.width = (audio.duration ? (audio.currentTime / audio.duration * 100) : 0) + '%';
    }
    audio.addEventListener('loadedmetadata', updateTime);
    audio.addEventListener('timeupdate', updateTime);
    audio.addEventListener('ended', function(){ playBtn.textContent = '▶'; });
    audio.addEventListener('play', function(){
      if(currentAudio && currentAudio !== audio){ currentAudio.pause(); if(currentPlayBtn) currentPlayBtn.textContent = '▶'; }
      currentAudio = audio; currentPlayBtn = playBtn;
    });
    playBtn.addEventListener('click', function(){
      if(audio.paused){ audio.play(); playBtn.textContent = '❙❙'; }
      else { audio.pause(); playBtn.textContent = '▶'; }
    });
    track.addEventListener('click', function(e){
      var r = track.getBoundingClientRect();
      var ratio = (e.clientX - r.left) / r.width;
      if(audio.duration) audio.currentTime = ratio * audio.duration;
    });
    speedBtn.addEventListener('click', function(){
      var speeds = [1, 1.25, 0.75];
      var cur = parseFloat(speedBtn.getAttribute('data-speed'));
      var next = speeds[(speeds.indexOf(cur)+1) % speeds.length];
      audio.playbackRate = next;
      speedBtn.setAttribute('data-speed', next);
      speedBtn.textContent = next + '×';
    });
    var checkBox = item.querySelector('.check');
    if(checkBox){
      var input = checkBox.querySelector('.check-input');
      var checkBtn = checkBox.querySelector('.check-btn');
      var resultEl = item.querySelector('.check-result');
      var target = checkBox.getAttribute('data-target');
      function norm(s){ return s.replace(/[\s，。、！？；：""''.,!?;:·…—\-]/g, ''); }
      function doCheck(){
        var typed = norm(input.value);
        if(!typed){ resultEl.innerHTML = ''; return; }
        var correct = 0, out = '';
        for(var i = 0; i < target.length; i++){
          var cls = (typed[i] === target[i]) ? 'ok' : 'bad';
          if(typed[i] === target[i]) correct++;
          out += '<span class="' + cls + '">' + esc(target[i]) + '</span>';
        }
        var extra = typed.length > target.length ? typed.slice(target.length) : '';
        var score = correct + '/' + target.length + ' chữ';
        if(correct === target.length && typed.length === target.length){
          resultEl.innerHTML = '<div class="ok">✓ Đúng hết</div><div>' + out + '</div>';
        } else {
          resultEl.innerHTML = '<div>' + out + (extra ? '<span class="bad">' + esc(extra) + '</span>' : '') + '</div>' +
            '<div class="score">Đúng ' + score + ' — chữ đỏ là chữ chưa đúng</div>';
        }
      }
      checkBtn.addEventListener('click', doCheck);
      input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); doCheck(); } });
      input.addEventListener('input', function(){ resultEl.innerHTML = ''; });
    }
    item.querySelector('.ans-row').addEventListener('click', function(){
      var ans = item.querySelector('.answer');
      var row = item.querySelector('.ans-row');
      ans.classList.toggle('open');
      row.classList.toggle('open', ans.classList.contains('open'));
    });
    item.querySelector('.tg-py').addEventListener('click', function(e){
      e.target.classList.toggle('on');
      item.querySelector('.answer').classList.toggle('show-pinyin', e.target.classList.contains('on'));
    });
    item.querySelector('.tg-vi').addEventListener('click', function(e){
      e.target.classList.toggle('on');
      item.querySelector('.answer').classList.toggle('show-vi', e.target.classList.contains('on'));
    });
  });
}

renderHome();
</script>
</body>
</html>
